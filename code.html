<!DOCTYPE html>
<html>
<head>
  <title>Resume Boost</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: slategray;
      text-align: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    textarea {
      width: 100%;
      height: 150px;
      margin: 10px 0;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      padding: 10px 20px;
      border: none;
      background: #4CAF50;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .missing {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>RESUME BOOST</h1>
  <hr/>
  <br/>
  <p><b>Step 1:</b> Paste your Resume text</p>
  <textarea id="resumeText" placeholder="Paste resume here."></textarea>

  <p><b>Step 2:</b> Paste Job Description text</p>
  <textarea id="jdText" placeholder="Paste job description here."></textarea>

  <button onclick="analyze()">Analyze</button>

  <div class="result" id="resultBox">
    <p><b>Missing Keywords will appear here.</b></p>
  </div>

  <script>
     function analyze() {
        var resume=document.getElementById("resumeText").value.toLowerCase();
        var jd=document.getElementById("jdText").value.toLowerCase();

        var resumeWords=resume.split(/\W+/);
        var jdWords=jd.split(/\W+/);

        var stop=["a","about","above","after","again","against","all","am","an","and","any","are","aren't","as","at","be","because","been","before","being","below","between","both","but","by","can","can't","cannot","could","couldn't","did","didn't","do","does","doesn't","doing","don't","down","during","each","few","for","from","further","had","hadn't","has","hasn't","have","haven't","having","he","he'd","he'll","he's","her","here","here's","hers","herself","him","himself","his","how","how's","i","i'd","i'll","i'm","i've","if","in","into","is","isn't","it","it's","its","itself","let's","me","more","most","mustn't","my","myself","no","nor","not","good","of","off","on","once","only","or","other","ought","our","ours","ourselves","out","over","own","same","shan't","she","she'd","she'll","she's","should","shouldn't","so","some","such","than","that","that's","the","their","theirs","them","themselves","then","there","there's","these","they","they'd","they'll","they're","they've","this","those","through","to","too","under","until","up","very","was","wasn't","we","we'd","we'll","we're","we've","were","weren't","what","what's","when","when's","where","where's","which","while","who","who's","whom","why","why's","with","won't","would","wouldn't","you","you'd","you'll","you're","you've","your","yours","yourself","yourselves","communication","good","skilled","skills","looking","applicable","candidate","like"];

        var cleanJD=[];
        for(var i=0;i<jdWords.length;i++) {
            var w=jdWords[i];
            if(w.length>2 && stop.indexOf(w)===-1) {
            cleanJD.push(w);
            }
        }
        var cleanResume=[];
        for(var j=0;j<resumeWords.length;j++) {
            var r=resumeWords[j];
            if(r.length>2 && stop.indexOf(r)===-1) {
            cleanResume.push(r);
            }
        }
        var missing=[];
        for(var k=0; k<cleanJD.length;k++) {
            var word=cleanJD[k];
            if (cleanResume.indexOf(word)===-1 && missing.indexOf(word)===-1) {
            missing.push(word);
            }
        }
        var box=document.getElementById("resultBox");
        if(missing.length>0) {
            box.innerHTML="<b>Missing Keywords:</b><br><span class='missing'>" + missing.join(", ") + "</span>";
        } 
        else {
            box.innerHTML="<b style='color:green'>Great! No major keywords missing.</b>";
        }
    }
  </script>

</body>
</html>
